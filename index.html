<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Momen AI 2.0</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#0b1020;color:#f8fafc;min-height:100vh;display:flex;justify-content:center}
    .app{width:min(920px,100%);min-height:100vh;display:flex;flex-direction:column;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 18px;border-bottom:1px solid #273449}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:20px}
    h1{font-size:20px;margin:0} .sub{font-size:12px;color:#94a3b8;margin-top:3px}
    button{border:0;border-radius:12px;padding:11px 15px;background:#263449;color:#fff;font-weight:600;cursor:pointer}
    .status{font-size:12px;color:#a5b4fc;padding:8px 12px;border:1px solid #334155;border-radius:20px}
    #chat{flex:1;overflow:auto;padding:20px 2px;display:flex;flex-direction:column;gap:14px}
    .welcome{margin:auto;text-align:center;max-width:520px;color:#cbd5e1;padding:28px 12px}.welcome h2{font-size:26px;color:white;margin:0 0 10px}
    .msg{max-width:85%;padding:13px 16px;border-radius:17px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-start;background:#1d4ed8;border-bottom-left-radius:5px}.bot{align-self:flex-end;background:#172338;border:1px solid #29384e;border-bottom-right-radius:5px}
    .composer{border:1px solid #334155;background:#111b2d;border-radius:18px;padding:10px;display:flex;gap:9px;align-items:flex-end}
    textarea{flex:1;resize:none;min-height:48px;max-height:150px;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:10px;line-height:1.5}
    #send{background:#2563eb;min-width:76px} #send:disabled{opacity:.55;cursor:wait}
    footer{text-align:center;color:#64748b;font-size:11px;padding:12px}
    .error{color:#fca5a5}
    @media(max-width:600px){.app{padding:12px}.msg{max-width:94%}h1{font-size:18px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">M</div><div><h1>Momen AI 2.0</h1><div class="sub">مساعدك الذكي</div></div></div>
    <div class="status" id="status">جاري الاتصال...</div>
    <button id="newChat" type="button">محادثة جديدة</button>
  </header>
  <main id="chat">
    <div class="welcome" id="welcome"><h2>أهلًا بك في Momen AI</h2><div>اكتب سؤالك وسأحاول مساعدتك.</div></div>
  </main>
  <form id="form" class="composer">
    <textarea id="message" placeholder="اكتب رسالتك هنا..." rows="1" aria-label="رسالتك"></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>
  <footer>نسخة تجريبية — Momen AI 2.0</footer>
</div>
<script>
(() => {
  const API = "https://moumenai2.moumentsaad.workers.dev/";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const welcome = document.getElementById("welcome");

  function addMessage(text, kind) {
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function checkApi() {
    try {
      const r = await fetch(API);
      const raw = await r.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error("المحرك رجّع استجابة غير مفهومة."); }
      status.textContent = data.status === "running" ? "المحرك متصل" : "تحقق من المحرك";
    } catch (e) {
      status.textContent = "تعذر الاتصال";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message || send.disabled) return;
    addMessage(message, "user");
    input.value = "";
    send.disabled = true;
    send.textContent = "...";
    const pending = addMessage("جاري التفكير...", "bot");
    try {
      const response = await fetch(API, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message})
      });
      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); }
      catch { throw new Error("السيرفر أرسل ردًا فارغًا أو غير صالح. راجع إعدادات المحرك."); }
      if (!response.ok || data.error) {
        const detail = data.details ? "\nالتفاصيل: " + data.details : "";
        throw new Error((data.error || "حدث خطأ في الاتصال") + detail);
      }
      pending.textContent = data.reply || "وصل رد فارغ من المحرك.";
    } catch (err) {
      pending.textContent = "تعذر الحصول على رد: " + (err.message || "خطأ غير معروف");
      pending.classList.add("error");
    } finally {
      send.disabled = false;
      send.textContent = "إرسال";
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  });

  document.getElementById("newChat").addEventListener("click", () => {
    chat.innerHTML = '<div class="welcome" id="welcome"><h2>أهلًا بك في Momen AI</h2><div>اكتب سؤالك وسأحاول مساعدتك.</div></div>';
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  checkApi();
})();
</script>
</body>
</html>
